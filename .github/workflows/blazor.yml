name: Blazor

# The security regression jobs start the whole AppHost stack, so the path filters cover everything that stack builds or runs: the
# account and main systems, the gateway, the React build the gateway waits for, and the shared props, package and SDK files.
on:
  push:
    branches:
      - main
    paths:
      - "blazor/**"
      - "application/AppHost/**"
      - "application/AppGateway/**"
      - "application/account/**"
      - "application/main/**"
      - "application/shared-kernel/**"
      - "application/shared-webapp/**"
      - "application/platform-settings.jsonc"
      - "application/Directory.Build.props"
      - "application/Directory.Packages.props"
      - "application/dotnet-tools.json"
      - "application/global.json"
      - "application/package.json"
      - "application/package-lock.json"
      - "application/turbo.json"
      - "application/.node-version"
      - "developer-cli/**"
      - ".github/workflows/blazor.yml"
      - "!**.md"
  pull_request:
    paths:
      - "blazor/**"
      - "application/AppHost/**"
      - "application/AppGateway/**"
      - "application/account/**"
      - "application/main/**"
      - "application/shared-kernel/**"
      - "application/shared-webapp/**"
      - "application/platform-settings.jsonc"
      - "application/Directory.Build.props"
      - "application/Directory.Packages.props"
      - "application/dotnet-tools.json"
      - "application/global.json"
      - "application/package.json"
      - "application/package-lock.json"
      - "application/turbo.json"
      - "application/.node-version"
      - "developer-cli/**"
      - ".github/workflows/blazor.yml"
      - "!**.md"
  # Firefox and WebKit run the security regressions nightly on main, and are required on the final stage candidate: dispatch
  # the workflow on that commit with browsers set to all. Pull requests and pushes run them in Chromium.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      browsers:
        description: "Browsers for the security regressions: chromium, or all for the final stage candidate"
        type: choice
        options:
          - chromium
          - all
        default: chromium

concurrency:
  group: blazor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read .NET SDK Versions
        id: sdk_versions
        run: |
          # blazor/, application/ and developer-cli/ each pin an SDK in their own global.json, and the CLI runs commands in all three
          {
            echo "versions<<EOF"
            jq -r '.sdk.version' blazor/global.json application/global.json developer-cli/global.json | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk_versions.outputs.versions }}

      - name: Generate and Set User Secret for Token Signing Key
        working-directory: application/shared-kernel/SharedKernel
        run: |
          # Extract UserSecretsId from the .csproj file
          USER_SECRETS_ID=$(grep -oP '(?<=<UserSecretsId>).*?(?=</UserSecretsId>)' SharedKernel.csproj)

          # Generate a 512-bit key and set it as a user secret that can be use for token signing when running tests
          dotnet user-secrets set "authentication-token-signing-key" "$(openssl rand -base64 64)" --id $USER_SECRETS_ID

      - name: Build Blazor Solution
        working-directory: developer-cli
        run: dotnet run -- build --blazor

      - name: Run Tests
        working-directory: developer-cli
        run: dotnet run -- test --blazor --no-build

  code-style:
    name: Code Linting and Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read .NET SDK Versions
        id: sdk_versions
        run: |
          # blazor/, application/ and developer-cli/ each pin an SDK in their own global.json, and the CLI runs commands in all three
          {
            echo "versions<<EOF"
            jq -r '.sdk.version' blazor/global.json application/global.json developer-cli/global.json | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk_versions.outputs.versions }}

      - name: Restore .NET Tools
        working-directory: blazor
        run: dotnet tool restore

      - name: Build Blazor Solution
        working-directory: developer-cli
        run: dotnet run -- build --blazor

      - name: Check for Formatting Issues
        working-directory: developer-cli
        run: |
          dotnet run -- format --blazor --no-build --all-files --verify-build

          git diff --exit-code || {
            echo "Formatting issues detected. Please run 'dotnet run --project developer-cli -- format --blazor --all-files' locally and commit the formatted code."
            exit 1
          }

      - name: Run Code Linting
        working-directory: developer-cli
        run: |
          set +e
          dotnet run -- lint --blazor --no-build
          LINT_EXIT_CODE=$?
          set -e

          if [ $LINT_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "::error::Code linting issues found."
            echo ""

            RESULT_FILE="${GITHUB_WORKSPACE}/blazor/result.json"

            if [ -f "$RESULT_FILE" ]; then
              cat "$RESULT_FILE"
              echo ""
              echo "### Code Inspection Issues" >> $GITHUB_STEP_SUMMARY
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat "$RESULT_FILE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "Result file not found in blazor/"
            fi
            exit 1
          fi

  publish:
    name: Trimmed Release Publish
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read .NET SDK Versions
        id: sdk_versions
        run: |
          # blazor/, application/ and developer-cli/ each pin an SDK in their own global.json, and the CLI runs commands in all three
          {
            echo "versions<<EOF"
            jq -r '.sdk.version' blazor/global.json application/global.json developer-cli/global.json | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk_versions.outputs.versions }}

      - name: Publish Trimmed Release Build
        working-directory: developer-cli
        run: dotnet run -- blazor-publish

  published-security:
    name: Published Security Regressions (${{ matrix.browser }})
    needs: publish
    runs-on: ubuntu-24.04
    # The Chromium leg also measures the public pages and the authenticated startup, about ten more minutes
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.browsers == 'all') && '["chromium","firefox","webkit"]' || '["chromium"]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read .NET SDK Versions
        id: sdk_versions
        run: |
          # blazor/, application/ and developer-cli/ each pin an SDK in their own global.json, and the CLI runs commands in all three
          {
            echo "versions<<EOF"
            jq -r '.sdk.version' blazor/global.json application/global.json developer-cli/global.json | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk_versions.outputs.versions }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version-file: application/.node-version

      - name: Install Node Modules
        working-directory: application
        run: npm ci

      - name: Install Playwright Browser
        working-directory: application
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Generate and Set User Secret for Token Signing Key
        working-directory: application/shared-kernel/SharedKernel
        run: |
          # Extract UserSecretsId from the .csproj file
          USER_SECRETS_ID=$(grep -oP '(?<=<UserSecretsId>).*?(?=</UserSecretsId>)' SharedKernel.csproj)

          # A disposable 512-bit key for this run; the AppHost and the published host read it from the same user secrets store
          dotnet user-secrets set "authentication-token-signing-key" "$(openssl rand -base64 64)" --id $USER_SECRETS_ID

      - name: Prepare Local Host Names and Certificate Trust
        run: |
          # Browsers and curl resolve *.localhost themselves; the entry covers any tool that asks the system resolver
          echo "127.0.0.1 app.dev.localhost back-office.dev.localhost" | sudo tee -a /etc/hosts

          # The AppHost creates and trusts the development certificate on start; on Linux, .NET trusts it for OpenSSL
          # through this directory, which the gateway, the account API and the published host read
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Start Stack on a Fresh Database Without the Blazor Host
        working-directory: developer-cli
        # Ready only when both workers have migrated the empty database and reconciled feature flags, and the APIs and the gateway answer with their documented success status in the same poll
        run: dotnet run -- start-stack --without-blazor-host --fresh-database --timeout 1200

      - name: Publish Trimmed Release Build
        working-directory: developer-cli
        run: dotnet run -- blazor-publish

      - name: Serve Published Host Behind the Gateway
        id: serve
        working-directory: developer-cli
        run: |
          nohup dotnet run -- blazor-serve > "$GITHUB_WORKSPACE/.workspace/blazor-serve.log" 2>&1 &

          BASE_PORT=$(cat "$GITHUB_WORKSPACE/.workspace/port.txt")
          for attempt in $(seq 1 60); do
            if curl --silent --insecure --fail --output /dev/null "https://app.dev.localhost:$BASE_PORT/blazor/"; then
              echo "The gateway serves the published host after $attempt attempts"
              exit 0
            fi
            sleep 5
          done

          echo "::error::The gateway did not serve the published host within 300 seconds."
          cat "$GITHUB_WORKSPACE/.workspace/blazor-serve.log"
          exit 1

      # Each regression runs even when an earlier one failed, so one run records the whole matrix. The published host runs
      # in Production from the trimmed Release publish, and every journey signs in with the code read from the test mail server.
      - name: Run Trimmed Smoke Test (en-US)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness trimmed-smoke --browser ${{ matrix.browser }} --culture en-US

      - name: Run Trimmed Smoke Test (da-DK)
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness trimmed-smoke --browser ${{ matrix.browser }} --culture da-DK

      - name: Run Antiforgery Regressions
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness antiforgery --browser ${{ matrix.browser }}

      - name: Run Authentication State Regressions
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness authentication-state --browser ${{ matrix.browser }}

      - name: Run Production Shell Policy
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness shell-policy --browser ${{ matrix.browser }} --environment production

      - name: Verify Security Matrix
        if: ${{ !cancelled() }}
        working-directory: developer-cli
        run: >-
          dotnet run -- blazor-harness verify-results --browser ${{ matrix.browser }} --label published
          --require "trimmed-smoke-{browser}-en-US,trimmed-smoke-{browser}-da-DK,antiforgery-{browser},authentication-state-{browser},shell-policy-{browser}-production"

      # The frozen public-page budget (200,000 transfer bytes and 300 ms first contentful paint, medians of seven cold loads
      # after one warm-up on the throttled profile) and zero WebAssembly runtime requests on the six public pages and the
      # enhanced navigation, against the same publish, on every pull request, push, nightly run and dispatch. The budget is
      # defined on Chromium only, since Firefox and WebKit have no network throttling in the browser automation library.
      - name: Check Public-Page Budget
        if: ${{ !cancelled() && steps.serve.outcome == 'success' && matrix.browser == 'chromium' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness public-pages --browser chromium --profile throttled --check-budget --label budget

      # A labelled reference for later authenticated surfaces, not a budget: it fails only when the page never becomes interactive
      - name: Measure Authenticated Startup Baseline
        if: ${{ !cancelled() && steps.serve.outcome == 'success' && matrix.browser == 'chromium' }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness interactive-load --browser chromium --label authenticated-startup-baseline

      - name: Verify Measurement Results
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        working-directory: developer-cli
        run: >-
          dotnet run -- blazor-harness verify-results --browser chromium --label measurements
          --require "public-pages-budget-{browser},interactive-load-authenticated-startup-baseline-{browser}"

      - name: Upload Measurements
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        uses: actions/upload-artifact@v7
        with:
          name: public-page-budget-${{ github.sha }}
          path: |
            .workspace/blazor-tests/public-pages-budget-chromium.json
            .workspace/blazor-tests/interactive-load-authenticated-startup-baseline-chromium.json
            .workspace/blazor-tests/security-matrix-chromium-measurements.json
          if-no-files-found: error

      # Results only: browser traces hold cookies and typed one-time passwords, so they stay on the runner
      - name: Upload Security Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: published-security-${{ matrix.browser }}
          path: .workspace/blazor-tests/*.json
          if-no-files-found: error

      - name: Upload Process Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-security-logs-${{ matrix.browser }}
          path: |
            .workspace/developer-cli/aspire-apphost.log
            .workspace/blazor-serve.log
          if-no-files-found: ignore

      - name: Stop Published Host and Stack
        if: always()
        working-directory: developer-cli
        run: |
          pkill -f "Blazor.Host.dll" || true
          dotnet run -- stop

  development-shell-policy:
    name: Development Shell Policy Fixture Check (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.browsers == 'all') && '["chromium","firefox","webkit"]' || '["chromium"]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read .NET SDK Versions
        id: sdk_versions
        run: |
          # blazor/, application/ and developer-cli/ each pin an SDK in their own global.json, and the CLI runs commands in all three
          {
            echo "versions<<EOF"
            jq -r '.sdk.version' blazor/global.json application/global.json developer-cli/global.json | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk_versions.outputs.versions }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version-file: application/.node-version

      - name: Install Node Modules
        working-directory: application
        run: npm ci

      - name: Install Playwright Browser
        working-directory: application
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Generate and Set User Secret for Token Signing Key
        working-directory: application/shared-kernel/SharedKernel
        run: |
          # Extract UserSecretsId from the .csproj file
          USER_SECRETS_ID=$(grep -oP '(?<=<UserSecretsId>).*?(?=</UserSecretsId>)' SharedKernel.csproj)

          # A disposable 512-bit key for this run
          dotnet user-secrets set "authentication-token-signing-key" "$(openssl rand -base64 64)" --id $USER_SECRETS_ID

      - name: Prepare Local Host Names and Certificate Trust
        run: |
          echo "127.0.0.1 app.dev.localhost back-office.dev.localhost" | sudo tee -a /etc/hosts
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      # The AppHost runs the Debug build of the Blazor host in Development, which serves the Development-only fixture pages.
      # This is a fixture check of the policy and is never Production evidence; the published job holds that.
      - name: Start Stack on a Fresh Database With the Development Blazor Host
        working-directory: developer-cli
        run: dotnet run -- start-stack --fresh-database --timeout 1200

      - name: Run Development Shell Policy
        working-directory: developer-cli
        run: dotnet run -- blazor-harness shell-policy --browser ${{ matrix.browser }}

      - name: Verify Fixture Result
        if: ${{ !cancelled() }}
        working-directory: developer-cli
        run: dotnet run -- blazor-harness verify-results --browser ${{ matrix.browser }} --label development --require "shell-policy-{browser}-development"

      - name: Upload Fixture Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: development-shell-policy-${{ matrix.browser }}
          path: .workspace/blazor-tests/*.json
          if-no-files-found: error

      - name: Upload Process Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-shell-policy-logs-${{ matrix.browser }}
          path: .workspace/developer-cli/aspire-apphost.log
          if-no-files-found: ignore

      - name: Stop Stack
        if: always()
        working-directory: developer-cli
        run: dotnet run -- stop
